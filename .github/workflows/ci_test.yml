name: CI
run-name: "MetaX proxy validation / 000 + 002"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run"
        type: choice
        required: true
        default: nvidia
        options:
          - nvidia
          - iluvatar
          - metax
          - moore
          - cambricon
          - ascend
          - all

jobs:
  ci:
    uses: InfiniTensor/ci/.github/workflows/infiniops-ci.yml@901566229509ac54f520210c6856bf163209f907
    with:
      config_path: .github/ci_config.yml
      ci_ref: 901566229509ac54f520210c6856bf163209f907
      max_parallel: 2
      platform: metax
    secrets: inherit
