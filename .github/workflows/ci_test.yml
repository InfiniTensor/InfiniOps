name: CI
run-name: "Runner fleet / ${{ inputs.platform || 'all' }}"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'default' }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run"
        type: choice
        required: true
        default: nvidia
        options:
          - nvidia
          - iluvatar
          - metax
          - moore
          - cambricon
          - hygon
          - ascend
          - all
  push:
    branches: ["master"]
  pull_request:
    branches: ["master", "ci/ci-online"]

jobs:
  ci:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'hygon' }}
    uses: InfiniTensor/ci/.github/workflows/infiniops-ci.yml@901566229509ac54f520210c6856bf163209f907
    with:
      config_path: .github/ci_config.yml
      ci_ref: 901566229509ac54f520210c6856bf163209f907
      max_parallel: 2
      platform: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' && 'nvidia,iluvatar,metax,moore,cambricon,ascend' || inputs.platform) || 'nvidia,iluvatar,metax,moore,cambricon,ascend' }}
    secrets: inherit

  hygon-runner-acceptance:
    name: Hygon / ${{ matrix.runner }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'hygon' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner:
          - Hygon-Server-001
          - Hygon-Server-002
          - Hygon-Server-003
          - Hygon-Server-004
          - Hygon-Server-005
          - Hygon-Server-006
          - Hygon-Server-007
    runs-on: [self-hosted, linux, "${{ matrix.runner }}"]
    env:
      EXPECTED_RUNNER_NAME: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify service account, Docker and platform smoke tests
        run: python3 .github/scripts/validate_hygon_runner.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runner }}-results
          path: ci-results/hygon-runner
          if-no-files-found: ignore
