name: Compatibility Baseline

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  source-review-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test baseline guard including rejection cases
        run: python -m unittest discover -s tests -p test_p0_guards.py -v
      - name: Check declaration and policy inputs
        run: python scripts/compatibility_baseline.py check --baseline docs/refactor/compatibility-baseline.json
